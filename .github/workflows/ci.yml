name: CI

on:
  workflow_dispatch:
    inputs:
      full-bench:
        description: Run make bench-full (adds launch benchmarks; needs unlocked desktop)
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64, inkora]
    timeout-minutes: 30
    env:
      INKORA_CAPTURE_SCREEN: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up toolchain
        run: make setup
      - name: Lint
        run: make lint
      - name: Test CI helpers
        run: make test-ci
      - name: Test all layers
        run: make test-all
      - name: Build and launch release offline
        run: make test-ui-release
      - name: Performance baseline (light, warn-only)
        if: ${{ !inputs.full-bench }}
        timeout-minutes: 4
        run: make bench
      - name: Full performance baseline
        timeout-minutes: 8
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full-bench }}
        run: make bench-full
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inkora-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
