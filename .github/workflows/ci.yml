name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64, inkora]
    timeout-minutes: 30
    env:
      INKORA_CAPTURE_SCREEN: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up toolchain
        run: make setup
      - name: Lint
        run: make lint
      - name: Test all layers
        run: make test-all
      - name: Build and launch release offline
        run: make test-ui-release
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inkora-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
