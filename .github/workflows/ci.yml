name: CI

# CI 只能手动触发（workflow_dispatch）：合并前必须在已 rebase 到最新 main 的
# 分支上手动触发并通过；需要时也可以在 main 上手动触发。
# 默认不运行 UI 套件（runner 是开发者本机，UI 测试需要解锁桌面和 Automation
# Mode）；发布前或用户明确要求时用 -f ui-tests=true 运行，规则见 docs/testing.md。
on:
  workflow_dispatch:
    inputs:
      ui-tests:
        description: Run UI suites (XCUITest + release launch smoke); needs unlocked desktop and Automation Mode
        type: boolean
        default: false
      full-bench:
        description: Run make bench-full (adds launch benchmarks; needs unlocked desktop)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64, inkora]
    timeout-minutes: 30
    env:
      INKORA_CAPTURE_SCREEN: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up toolchain
        run: make setup
      - name: Lint
        run: make lint
      - name: Test non-UI layers
        run: make test-non-ui
      - name: Release bundle check (offline)
        run: make release-bundle-check
      - name: UI acceptance (XCUITest)
        if: ${{ inputs.ui-tests }}
        run: make test-document-open-ui
      - name: UI release launch smoke
        if: ${{ inputs.ui-tests }}
        run: make test-ui-release
      - name: Performance baseline (light, warn-only)
        if: ${{ !inputs.full-bench }}
        timeout-minutes: 4
        run: make bench
      - name: Full performance baseline
        timeout-minutes: 8
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full-bench }}
        run: make bench-full
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inkora-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
