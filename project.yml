name: Inkora
options:
  bundleIdPrefix: com.huruizhi
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  postGenCommand: mkdir -p Inkora.xcodeproj/project.xcworkspace/xcshareddata/swiftpm && cp config/Package.resolved Inkora.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targetTemplates:
  InkoraApplication:
    type: application
    platform: macOS
    sources:
      - path: app/Sources
      - path: app/Resources/Assets.xcassets
      - path: app/Resources/Sparkle-LICENSE.txt
        buildPhase: resources
      - path: build/editor
        type: folder
        buildPhase: resources
    settings:
      base:
        INKORA_BUNDLE_IDENTIFIER: com.huruizhi.Inkora
        PRODUCT_BUNDLE_IDENTIFIER: $(INKORA_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: Inkora
        INFOPLIST_FILE: app/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: app/Resources/Inkora.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CURRENT_PROJECT_VERSION: 13
        MARKETING_VERSION: 0.1.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Build Editor
        script: |
          set -euo pipefail
          cd "$SRCROOT/editor"
          "$SRCROOT/.tools/node_modules/.bin/pnpm" build
        basedOnDependencyAnalysis: false
targets:
  Inkora:
    templates: [InkoraApplication]
  InkoraDistribution:
    templates: [InkoraApplication]
    dependencies:
      - package: Sparkle
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) INKORA_SPARKLE
        PRODUCT_NAME: Inkora
    preBuildScripts:
      - name: Require trusted signing identity
        script: |
          set -euo pipefail
          case "$CODE_SIGN_IDENTITY" in
            "Developer ID Application"*|"Apple Development"*) ;;
            *) echo "Sparkle distribution requires Developer ID or Apple Development signing" >&2; exit 1 ;;
          esac
          test "$CODE_SIGNING_ALLOWED" = YES
          test -n "$DEVELOPMENT_TEAM"
          test -n "$EXPANDED_CODE_SIGN_IDENTITY"
          test "$EXPANDED_CODE_SIGN_IDENTITY" != -
          if test "$CONFIGURATION" = Release; then
            case "$CODE_SIGN_IDENTITY" in
              "Developer ID Application"*) ;;
              *) echo "Release requires Developer ID Application" >&2; exit 1 ;;
            esac
          fi
        basedOnDependencyAnalysis: false
  InkoraTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: tests/InkoraTests
      - path: tests/fixtures
        type: folder
        buildPhase: resources
      - path: build/editor
        type: folder
        buildPhase: resources
      - path: app/Sources
        excludes:
          - AppDelegate.swift
  InkoraUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: tests/InkoraUITests
      - path: tests/InkoraTests/PerfTestSupport.swift
    dependencies:
      - target: Inkora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Inkora
schemes:
  Inkora:
    build:
      targets:
        Inkora: all
        InkoraTests: [test]
    test:
      targets:
        - InkoraTests
  InkoraDocumentOpenUI:
    build:
      targets:
        Inkora: all
        InkoraUITests: [test]
    test:
      targets:
        - InkoraUITests
  InkoraDistribution:
    build:
      targets:
        InkoraDistribution: all
